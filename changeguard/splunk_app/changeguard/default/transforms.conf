# The NPT lookups ChangeGuard reuses are NOT defined here: itam_ci_lookup, roboID.csv and
# global_address_lookup must already exist and be shared globally (or with this app).

[cg_cases_lookup]
external_type = kvstore
collection = cg_cases
fields_list = _key, case_id, session_device, platform, device_role, targets, doi, ci_names, user, user_display, user_title, itam_user, is_automation, src, first_seen, last_seen, event_count, cmds, change_log, has_detail, chg_refs, comments, truncated, status, verdict, severity, created_at, updated_at, chg_number, chg_key, chg_source, chg_device, match_via, chg_summary, chg_status, chg_approval, chg_implementer, chg_imp_group, planned_start, planned_end, is_ref, in_window, approved, user_ok, match_score, related_changes, candidate_count, alt_total, alt_candidate_keys, alt_evidence, reasons, confidence, deviations, evidence_refs, ai_raw, ai_attempts, authorising_change, watch_until, followup_case, followup_minutes, rollback_case, impact_score, impact_incident, impact_summary, impact_priority, impact_hops, impact_via, impact_delay_min, impact_candidates, dismissed_incidents, alerted_at, evidence_json, evidence_summary
max_matches = 100

[cg_changes_lookup]
external_type = kvstore
collection = cg_changes
fields_list = _key, change_id, source, device, ci_name, status, approval, approved, risk, chg_type, start, end, actual_start, actual_end, created_at, implementer, imp_group, summary, description, plan, updated_at
max_matches = 200

# Extra HA pairs where the 01/02 naming rule (cg_ha_peer) does not apply: device_a, device_b
[cg_ha_pairs]
filename = cg_ha_pairs.csv
case_sensitive_match = false

# Firewall -> managing Panorama, when it is not `cg_default_panorama`: firewall, panorama
[cg_panorama_members]
filename = cg_panorama_members.csv
case_sensitive_match = false

# Written by "CG - ML - Score proposed changes"
[cg_change_risk]
filename = cg_change_risk.csv

[cg_demo_detections]
filename = cg_demo_detections.csv

[cg_demo_changes]
filename = cg_demo_changes.csv
