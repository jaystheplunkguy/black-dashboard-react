[cg_cases_lookup]
external_type = kvstore
collection = cg_cases
fields_list = _key, case_id, device, user, itam_user, platform, src, first_seen, last_seen, event_count, change_log, has_detail, chg_refs, truncated, status, verdict, severity, created_at, updated_at, ci_key, ci_name, services, chg_number, chg_summary, chg_approval, chg_implementer, planned_start, planned_end, in_window, approved, user_ok, match_score, alt_total, alt_candidate_keys, alt_evidence, reasons, confidence, deviations, evidence_refs, ai_raw, ai_attempts, authorising_change, watch_until, impact_score, impact_incident, impact_summary, impact_priority, impact_hops, impact_via, impact_delay_min, impact_candidates, spike_rules, dismissed_incidents, alerted_at, evidence_json, evidence_summary

[cg_ci_index]
external_type = kvstore
collection = cg_ci_index
fields_list = _key, ci_id, collection

# device_user (as logged by the device / TACACS / FMC) -> itam_user (HELIX login id)
[cg_identity]
filename = cg_identity.csv
case_sensitive_match = false

# Log hostname or IP -> canonical device name (when the device logs under a different name)
[cg_device_alias]
filename = cg_device_alias.csv
case_sensitive_match = false

# Manual device -> HELIX CI mapping where name matching fails
[cg_device_ci_override]
filename = cg_device_ci_override.csv

# HA pairs (device_a, device_b)
[cg_ha_pairs]
filename = cg_ha_pairs.csv

# Written hourly by "CG - L6s - Deny spikes"
[cg_deny_spike]
filename = cg_deny_spike.csv
max_matches = 20

# Written by "CG - ML - Score proposed changes"
[cg_change_risk]
filename = cg_change_risk.csv

[cg_demo_detections]
filename = cg_demo_detections.csv
