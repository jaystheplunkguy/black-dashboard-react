# ArangoDB connection used by cgarango / cgaql. Override in local/changeguard.conf.
# The password is NOT stored here: add it to Splunk's encrypted storage (README, step 3):
#   realm = changeguard, username = <username below>
[arango]
url = https://arangodb.example.internal:8529
database = changeguard
username = changeguard
verify_ssl = true
timeout = 30
