# Normalised config-change facts (append-only audit evidence).
# In a distributed deployment this stanza must also be deployed to the indexers.
[changeguard_detect]
homePath = $SPLUNK_DB/changeguard_detect/db
coldPath = $SPLUNK_DB/changeguard_detect/colddb
thawedPath = $SPLUNK_DB/changeguard_detect/thaweddb
frozenTimePeriodInSecs = 31536000
