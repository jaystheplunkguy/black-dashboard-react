# ChangeGuard AI macros.
# Everything environment-specific lives here. Change values in local/macros.conf.
# [ASSUMED] marks field names / values that were not confirmed from real data:
# check them with `| fieldsummary` on day one.

###############################################################################
# 1. Sources
###############################################################################

# NPT triggers (from the task brief)
[cg_src_pan]
definition = index=network-services-pop-pan-net-s sourcetype="pan:config"

# CFGLOG_LOGGEDCMD only exists if "archive / log config / notify syslog" is enabled; harmless otherwise.
[cg_src_ios]
definition = index=network-services-pop-net-s ("%SYS-5-CONFIG_I" OR "%PARSER-5-CFGLOG_LOGGEDCMD")

# The brief's bare "@" term is a minor breaker in Splunk; the user@domain test is done with a regex
# in the detection search instead.
[cg_src_ftd]
definition = index=secops-nspfirewalls-net ("mojo_server.pl" OR "sfdccsm" OR "ActionQueueScrape.pl")

[cg_src_calm]
definition = index="cmart-db-app-n" REQUEST_STATE="*RT*"

[cg_itam_ci_extract]
definition = index="itam-ci-database-app-s" sourcetype="itam-ci-extract"

# [ASSUMED] how the HELIX tables are distinguished in the index (source = table name).
[cg_helix_change_info]
definition = index="itam-reporting-database-app-n" source="*Change_Information*"

[cg_helix_change_approvals]
definition = index="itam-reporting-database-app-n" source="*Change_Approvals*"

[cg_helix_change_ci]
definition = index="itam-reporting-database-app-n" source="*Change_CI_Assoc*"

[cg_helix_incidents]
definition = index="itam-reporting-database-app-n" source="*Incident_Data*"

# [ASSUMED] the Asset_* parent/child relationship tables. If itam-ci-extract already carries
# "Parent Name" + "Child Name", point this at `cg_itam_ci_extract` instead.
[cg_helix_ci_rel]
definition = index="itam-ci-database-app-s" source="*Asset*Relationship*"

# Which HELIX table an event came from (used by the CRQ feed).
[cg_helix_table]
definition = case(like(source, "%Change_Information%"), "info", like(source, "%Change_Approvals%"), "approval", like(source, "%Change_CI_Assoc%"), "ci", true(), "other")

###############################################################################
# 2. Normalisation
###############################################################################

# Hostname -> device key: lower-case short name, IPv4 kept whole.
# Must match changeguard_core.keys.normalise_host (the graph keys use the same rule).
[cg_norm_host(1)]
args = f
definition = if(match(trim($f$), "^\d{1,3}(\.\d{1,3}){3}$"), trim($f$), lower(trim(mvindex(split(trim($f$), "."), 0))))

# [ASSUMED] HA naming rule: ...01 <-> ...02 (nspnfp4aherb01/02). Overrides/extra pairs: cg_ha_pairs.csv.
[cg_ha_peer(1)]
args = d
definition = case(match($d$, "01$"), replace($d$, "01$", "02"), match($d$, "02$"), replace($d$, "02$", "01"), true(), null())

# [ASSUMED] Panorama naming (nspvmp1822da01). Add more with OR, or use cg_panorama_members.csv.
[cg_is_panorama(1)]
args = d
definition = match($d$, "^nspvmp")

# Panorama a firewall receives pushes from when cg_panorama_members.csv has no row for it.
[cg_default_panorama]
definition = "nspvmp1822da01"

# [ASSUMED] CHG reference formats in commit comments: CRQ000001234, CHG0012345, CALM-1234 / CALM1234.
[cg_chg_ref_rex]
definition = "(?i)(?<chg_ref>\b(?:CRQ\d{6,12}|CHG\d{5,12}|CALM[-_]?\d{3,12})\b)"

[cg_rollback_regex]
definition = "(?i)\b(rollback|roll back|revert|load config|configure replace|undo)\b"

# HELIX / CALM times: epoch, "YYYY-MM-DD HH:MM:SS[.0]" or "MM/DD/YYYY HH:MM:SS".
[cg_time(1)]
args = f
definition = if(match($f$, "^\d+(\.\d+)?$"), tonumber($f$), round(coalesce(strptime($f$, "%Y-%m-%d %H:%M:%S.%N"), strptime($f$, "%Y-%m-%d %H:%M:%S"), strptime($f$, "%m/%d/%Y %H:%M:%S")), 0))

###############################################################################
# 3. Enrichment (reuses the Config Change Monitor lookups, minus ITSI)
###############################################################################

# Identity: roboID.csv (automation accounts) and global_address_lookup (people). Uses the part of
# the user before any @ so FTD's user@domain and plain logins hit the same rows.
[cg_enrich_user]
definition = eval user_short=replace(user, "@.*$", "") \
    | lookup roboID.csv user AS user_short OUTPUTNEW description AS robo_description \
    | lookup global_address_lookup uid AS user_short OUTPUTNEW firstName surname title AS user_title \
    | eval is_automation=if(isnotnull(robo_description), 1, 0), \
        user_display=coalesce(robo_description, if(isnotnull(surname), surname.", ".firstName, null()), user) \
    | fields - firstName surname robo_description

# CI match on itam_ci_lookup by the normalised short name (CI). First match wins if a short name
# exists under several CI_Names (CG - Validate - CI match rate lists those).
[cg_ci_match(1)]
args = d
definition = lookup itam_ci_lookup CI AS $d$ OUTPUT CI_Name AS ci_name Name AS ci_product Category AS ci_category \
    | eval ci_name=mvindex(ci_name, 0), ci_product=mvindex(ci_product, 0), ci_category=mvindex(ci_category, 0)

# [ASSUMED] which itam_ci_lookup rows are business/technical services (for the graph).
[cg_is_service_ci]
definition = match(lower(coalesce(Category, "")." ".coalesce(Type, "")), "service")

# Shared by the detection search and the demo seed: takes the parsed fields
# platform device user cmd path comment src result msg event_id and produces the
# changeguard_detect schema.
[cg_detect_enrich]
definition = eval device=`cg_norm_host(device)`, user=lower(trim(user)) \
    | eval device_role=case(platform!="paloalto", platform, `cg_is_panorama(device)`, "panorama", true(), "firewall"), \
        event_kind=case(platform="paloalto" AND cmd="commit-all", "push", \
                        platform="paloalto" AND match(cmd, "^commit"), "commit", \
                        platform="paloalto", "edit", \
                        platform="cisco_ios" AND cmd="cli", "edit", true(), "notice") \
    | lookup cg_panorama_members firewall AS device OUTPUT panorama AS member_of \
    | eval session_device=if(event_kind="push" AND device_role="firewall", coalesce(member_of, `cg_default_panorama`), device), \
        detail=trim(if(platform="paloalto", coalesce(cmd, "")." ".coalesce(path, ""), coalesce(msg, cmd, "")).if(len(comment)>0, " [comment: ".comment."]", "")), \
        detail_kind=case(platform="paloalto" AND event_kind="edit" AND len(path)>0, "config_path", \
                         platform="cisco_ios" AND cmd="cli", "command", true(), "notice") \
    | rex field=detail max_match=5 `cg_chg_ref_rex` \
    | eval chg_refs=mvjoin(mvdedup(mvmap(chg_ref, upper(chg_ref))), " ") \
    | `cg_enrich_user` \
    | `cg_ci_match(device)` \
    | table _time event_id platform device device_role session_device event_kind user user_display user_title is_automation src cmd path comment result detail detail_kind chg_refs ci_name ci_product ci_category

###############################################################################
# 4. Change matching (deterministic, SPL)
###############################################################################

# A session is inside a CHG window if it starts and ends within [start - slack, end + slack].
[cg_window_slack]
definition = 1800

# "Related changes" window (the existing -48h / +1d logic, relative to the session):
# start >= first_seen - 48h, end <= last_seen + 1d, and the change had not ended more than 1h
# before the session started.
[cg_related_before]
definition = 172800

[cg_related_after]
definition = 86400

# Score weights: CHG ref in comment > in window > approved > implementer.
[cg_w_ref]
definition = 8

[cg_w_window]
definition = 4

[cg_w_approved]
definition = 2

[cg_w_user]
definition = 1

# [ASSUMED] CALM REQUEST_STATE values that mean approved. The feed only keeps *RT* states.
[cg_calm_approved(1)]
args = s
definition = match(upper(coalesce($s$, "")), "RT")

# [ASSUMED] HELIX: approved if Change_Approvals says so, else by change status.
[cg_helix_approved(2)]
args = approval, status
definition = if(lower(coalesce($approval$, ""))="approved" OR (isnull($approval$) AND match(lower(coalesce($status$, "")), "scheduled|implementation in progress|completed")), 1, 0)

###############################################################################
# 5. Sessions, watcher, AI
###############################################################################

[cg_summary_index]
definition = changeguard_detect

# A gap longer than this between a session device + user's events starts a new session (seconds).
[cg_session_gap]
definition = 1800

[cg_max_log_chars]
definition = 6000

# How long an approved change is watched (72h) and what counts as a quick follow-up (24h).
[cg_watch_seconds]
definition = 259200

[cg_followup_seconds]
definition = 86400

# Impact score contributions besides incidents (incident score = hops x delay x priority, 0-1).
[cg_w_rollback]
definition = 0.6

[cg_w_followup]
definition = 0.3

[cg_impact_threshold]
definition = 0.35

[cg_min_confidence]
definition = 0.6

# LLM backend: cg_llm_aitk (AI Toolkit 6.2 `| ai`, on-prem) or cg_llm_mock (offline, deterministic).
# Both leave the model's text in llm_raw.
[cg_llm(2)]
args = prompt_field, task
definition = `cg_llm_aitk($prompt_field$, $task$)`

# [ASSUMED] `| ai` option and output field names: confirm against Gareth's working AITK 6.2 search.
[cg_llm_aitk(2)]
args = prompt_field, task
definition = ai prompt="{$prompt_field$}" \
    | eval llm_raw=coalesce(ai_result_1, ai_result, response, result)

[cg_llm_mock(2)]
args = prompt_field, task
definition = eval llm_raw=case(\
    "$task$"="intent", if(match(change_log, "(?i)any|temp"),\
        "{\"verdict\":\"deviation\",\"confidence\":0.9,\"deviations\":[\"Session changed objects the CHG does not mention (any/temp rule)\"],\"reasons\":[\"mock: out-of-scope object in config paths\"],\"evidence_refs\":[\"change_log\"]}",\
        "{\"verdict\":\"match\",\"confidence\":0.85,\"deviations\":[],\"reasons\":[\"mock: objects changed match the CHG\"],\"evidence_refs\":[\"change_log\"]}"),\
    "$task$"="alt", case(alt_total>0,\
        "{\"verdict\":\"authorised_elsewhere\",\"authorising_change\":\"".mvindex(alt_candidate_keys,0)."\",\"confidence\":0.8,\"reasons\":[\"mock: first candidate accepted\"],\"evidence_refs\":[\"".mvindex(alt_candidate_keys,0)."\"]}",\
        is_automation=1, "{\"verdict\":\"unplanned\",\"authorising_change\":null,\"confidence\":0.7,\"reasons\":[\"mock: automation account changed config without a CHG\"],\"evidence_refs\":[]}",\
        true(), "{\"verdict\":\"unplanned\",\"authorising_change\":null,\"confidence\":0.9,\"reasons\":[\"mock: no candidates\"],\"evidence_refs\":[]}"),\
    "$task$"="impact", "{\"verdict\":\"plausible\",\"confidence\":0.75,\"reasons\":[\"mock: impact signal shortly after the change\"],\"evidence_refs\":[\"".coalesce(impact_incident, rollback_case, followup_case, "")."\"]}",\
    "$task$"="narrative", "[mock] ".verdict." on ".session_device." by ".user.". ".mvjoin(reasons, " "),\
    true(), "[mock] no answer")

# Pull the first {...} from the reply (models sometimes wrap JSON in prose or code fences)
# and the fields every ChangeGuard prompt asks for: verdict, confidence, reasons[], evidence_refs[].
[cg_parse_llm]
definition = rex field=llm_raw "(?s)(?<llm_json>\{.*\})" \
    | spath input=llm_json path=verdict output=llm_verdict \
    | spath input=llm_json path=confidence output=llm_confidence \
    | spath input=llm_json path=reasons{} output=llm_reasons \
    | spath input=llm_json path=evidence_refs{} output=llm_evidence_refs \
    | eval llm_verdict=lower(trim(llm_verdict)), llm_confidence=tonumber(llm_confidence)

[cg_nl]
definition = eval nl=urldecode("%0A")

[cg_case_fields]
definition = fields - aql_error arango_status arango_skipped nl cg_prompt llm_raw llm_json llm_verdict llm_confidence llm_reasons llm_evidence_refs

###############################################################################
# 6. ArangoDB access. The ONLY place that names the Arango commands.
# If you use the team's existing write/lookup commands instead of cgarango/cgaql,
# change these definitions; nothing else in the app has to change.
###############################################################################

# Splunk strips the quotes from macro arguments, so call sites quote comma lists ("a,b") and the
# definitions below quote them again for the command.
# Upsert documents: key = field holding the _key, fields = comma list to store.
[cg_aw_docs(3)]
args = collection, key, fields
definition = cgarango collection=$collection$ key=$key$ fields="$fields$" on_error=mark

# Upsert edges from the `from` / `to` fields ("collection/key"); rows without them are skipped.
[cg_aw_edges(2)]
args = collection, fields
definition = cgarango collection=$collection$ from=from to=to fields="$fields$" on_error=mark

# Run a named AQL query per row (bind params come from same-named fields, remapped by params).
[cg_aq(3)]
args = query, prefix, params
definition = cgaql query=$query$ prefix="$prefix$" params="$params$"

# One output row per query result.
[cg_aq_all(1)]
args = query
definition = cgaql query=$query$ mode=all

[cg_aq_json(2)]
args = query, out
definition = cgaql query=$query$ mode=json out=$out$

# Mirror a case into the Arango `cases` vertex (the agent reads cases from the graph).
[cg_sync_case]
definition = cgarango collection=cases key=case_id on_error=mark multivalue="targets,doi,related_changes,reasons,deviations,evidence_refs" \
    fields="case_id,session_device,platform,device_role,targets,doi,user,user_display,itam_user,is_automation,first_seen,last_seen,event_count,status,verdict,severity,chg_number,chg_source,match_via,chg_summary,related_changes,reasons,confidence,deviations,evidence_refs,watch_until,followup_case,rollback_case,impact_score,impact_incident,evidence_summary,alerted_at,updated_at"
