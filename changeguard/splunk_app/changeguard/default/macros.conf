# ChangeGuard AI macros.
# Everything environment-specific is here. Edit the sections marked EDIT ME
# (or override them in local/macros.conf) and leave the saved searches alone.

###############################################################################
# EDIT ME 1/4 - trigger sources (L1)
###############################################################################

[cg_src_pan]
definition = index=network-services-pop-pan-net-s sourcetype="pan:config"

# %PARSER-5-CFGLOG_LOGGEDCMD only exists if "archive / log config / logging enable / notify syslog"
# is configured on the device. Without it IOS changes cannot be intent-checked (scenario 03).
[cg_src_ios]
definition = index=network-services-pop-net-s ("%SYS-5-CONFIG_I" OR "%PARSER-5-CFGLOG_LOGGEDCMD")

[cg_src_ftd]
definition = index=secops-nspfirewalls-net ("mojo_server.pl" OR "sfdccsm" OR "ActionQueueScrape.pl") "*@*"

# Palo Alto traffic denies, used for the "deny spike on the modified rule" signal (L6).
[cg_src_pan_traffic]
definition = index=network-services-pop-pan-net-s sourcetype="pan:traffic" (action="deny" OR action="drop" OR action="reset-both" OR action="blocked")

###############################################################################
# EDIT ME 2/4 - HELIX (ITAM) tables. Tam's datasets page: polled every 5 min.
# Adjust the source/sourcetype filters to however each table lands in the index.
###############################################################################

[cg_helix_change_info]
definition = index=itam-reporting-database-app-n source="*Change_Information*"

[cg_helix_change_approvals]
definition = index=itam-reporting-database-app-n source="*Change_Approvals*"

[cg_helix_change_ci]
definition = index=itam-reporting-database-app-n source="*Change_CI_Assoc*"

[cg_helix_incidents]
definition = index=itam-reporting-database-app-n source="*Incident_Data*"

[cg_helix_ci]
definition = index=itam-ci-database-app-s source="*Asset_*" NOT source="*Relationship*"

[cg_helix_ci_rel]
definition = index=itam-ci-database-app-s source="*Asset_*Relationship*"

###############################################################################
# EDIT ME 3/4 - HELIX field mapping -> ChangeGuard canonical fields.
# Column names below are typical Remedy/HELIX names; check them against
# real rows on day one (`cg_helix_change_info` | head 5 | fieldsummary).
###############################################################################

# Canonical: chg_number summary description plan status chg_class risk implementer
#            planned_start planned_end actual_start actual_end created_at (epoch seconds)
[cg_map_change_info]
definition = eval chg_number=coalesce(Infrastructure_Change_ID, Change_ID, Change_Number),\
    summary=coalesce(Description, Summary, Short_Description),\
    description=coalesce(Detailed_Description, Change_Description),\
    plan=coalesce(Implementation_Plan, Change_Plan, Detailed_Description),\
    status=coalesce(Change_Request_Status, Status),\
    chg_class=case(match(lower(coalesce(Change_Timing, Class, Change_Class, "")), "emerg"), "Emergency",\
                   match(lower(coalesce(Change_Timing, Class, Change_Class, "")), "standard|no impact"), "Standard",\
                   true(), "Normal"),\
    risk=coalesce(Risk_Level, Risk),\
    implementer=lower(coalesce(ASLOGID, Assignee_Login_ID, Implementer_Login_ID, Assignee)),\
    planned_start=`cg_helix_time(coalesce(Scheduled_Start_Date, Planned_Start_Date))`,\
    planned_end=`cg_helix_time(coalesce(Scheduled_End_Date, Planned_End_Date))`,\
    actual_start=`cg_helix_time(Actual_Start_Date)`,\
    actual_end=`cg_helix_time(Actual_End_Date)`,\
    created_at=`cg_helix_time(Submit_Date)`

# Canonical: chg_number approval(Approved|Rejected|Pending) approver approval_time
[cg_map_change_approvals]
definition = eval chg_number=coalesce(Infrastructure_Change_ID, Change_ID, Request_ID),\
    approval=case(match(lower(coalesce(Approval_Status, Status, "")), "^approved"), "Approved",\
                  match(lower(coalesce(Approval_Status, Status, "")), "reject"), "Rejected",\
                  true(), "Pending"),\
    approver=lower(coalesce(Approver_Login_ID, Approver, Approvers)),\
    approval_time=`cg_helix_time(coalesce(Approval_Date, Modified_Date))`

# Canonical: chg_number ci_id
[cg_map_change_ci]
definition = eval chg_number=coalesce(Infrastructure_Change_ID, Change_ID, Request_ID01),\
    ci_id=coalesce(CI_ReconID, Reconciliation_Identity, ReconciliationIdentity, Request_ID02)

# Canonical: inc_number summary priority(1-4) inc_status opened_at ci_id service_id
[cg_map_incidents]
definition = eval inc_number=coalesce(Incident_Number, Incident_ID),\
    summary=coalesce(Description, Summary),\
    priority=case(match(lower(coalesce(Priority, "")), "critical|^1"), 1, match(lower(coalesce(Priority, "")), "high|^2"), 2,\
                  match(lower(coalesce(Priority, "")), "medium|^3"), 3, true(), 4),\
    inc_status=coalesce(Status, Incident_Status),\
    opened_at=`cg_helix_time(coalesce(Reported_Date, Submit_Date))`,\
    ci_id=coalesce(HPD_CI_ReconID, CI_ReconID),\
    service_id=coalesce(ServiceCI_ReconID, Service_ReconID)

# Canonical: ci_id name ci_class environment ci_status mgmt_ip deleted(0/1)
[cg_map_ci]
definition = eval ci_id=coalesce(ReconciliationIdentity, Reconciliation_Identity, CI_ID, InstanceId),\
    name=coalesce(Name, CI_Name, HostName),\
    ci_class=coalesce(ClassId, Class, CI_Class),\
    environment=coalesce(Environment, System_Environment),\
    ci_status=coalesce(AssetLifecycleStatus, Status),\
    mgmt_ip=coalesce(IP_Address, Management_IP),\
    deleted=if(coalesce(MarkAsDeleted, 0)=1 OR lower(coalesce(MarkAsDeleted, ""))="yes", 1, 0)

# Canonical: provider_id consumer_id rel_type deleted
# Direction: impact flows provider -> consumer (firewall -> app -> business service).
# In HELIX the service/app is usually the PARENT and the component the CHILD.
[cg_map_ci_rel]
definition = eval provider_id=coalesce(Child_ReconID, Destination_ReconciliationIdentity),\
    consumer_id=coalesce(Parent_ReconID, Source_ReconciliationIdentity),\
    rel_type=coalesce(Relationship_Name, Name, ClassId),\
    deleted=if(coalesce(MarkAsDeleted, 0)=1 OR lower(coalesce(MarkAsDeleted, ""))="yes", 1, 0)

# HELIX times: epoch seconds or "YYYY-MM-DD HH:MM:SS".
[cg_helix_time(1)]
args = f
definition = if(match($f$, "^\d+(\.\d+)?$"), tonumber($f$), strptime($f$, "%Y-%m-%d %H:%M:%S"))

[cg_is_service_ci]
definition = match(lower(coalesce(ci_class, "")), "businessservice|technicalservice|business service|application service")

[cg_is_network_ci]
definition = match(lower(coalesce(ci_class, "")), "firewall|router|switch|network|loadbalancer|load balancer|computersystem")

###############################################################################
# EDIT ME 4/4 - LLM. Pick the backend in cg_llm: cg_llm_aitk (AI Toolkit `| ai`,
# on-prem LLM) or cg_llm_mock (offline, deterministic - for building/testing).
# Both must leave the model's text in llm_raw.
###############################################################################

[cg_llm(2)]
args = prompt_field, task
definition = `cg_llm_aitk($prompt_field$, $task$)`

# AI Toolkit 6.2 `| ai`. Verify the option names and the output field with Gareth's working
# example; add provider=/model= if the on-prem connection is not the default.
[cg_llm_aitk(2)]
args = prompt_field, task
definition = ai prompt="{$prompt_field$}" \
    | eval llm_raw=coalesce(ai_result_1, ai_result, response, result)

[cg_llm_mock(2)]
args = prompt_field, task
definition = eval llm_raw=case(\
    "$task$"="intent", if(match(change_log, "(?i)\bany\b"),\
        "{\"match\":\"no\",\"confidence\":0.9,\"deviations\":[\"Rule uses 'any' where the CHG specifies a specific source/service\"],\"reasons\":[\"mock: broad match found in config\"],\"evidence_refs\":[\"change_log\"]}",\
        "{\"match\":\"yes\",\"confidence\":0.85,\"deviations\":[],\"reasons\":[\"mock: config consistent with CHG\"],\"evidence_refs\":[\"change_log\"]}"),\
    "$task$"="alt", if(alt_total>0,\
        "{\"verdict\":\"authorised_elsewhere\",\"authorising_change\":\"".mvindex(alt_candidate_keys,0)."\",\"confidence\":0.8,\"reasons\":[\"mock: first candidate accepted\"],\"evidence_refs\":[\"".mvindex(alt_candidate_keys,0)."\"]}",\
        "{\"verdict\":\"unplanned\",\"authorising_change\":null,\"confidence\":0.9,\"reasons\":[\"mock: no candidates\"],\"evidence_refs\":[]}"),\
    "$task$"="impact", "{\"plausible\":\"yes\",\"confidence\":0.75,\"reasons\":[\"mock: incident downstream shortly after change\"],\"evidence_refs\":[\"".impact_incident."\"]}",\
    "$task$"="narrative", "[mock] ".verdict." on ".device." by ".user.". ".mvjoin(reasons, " "),\
    true(), "[mock] no answer")

# Pull the first {...} out of the reply (models sometimes wrap JSON in prose or code fences).
[cg_parse_llm]
definition = rex field=llm_raw "(?s)(?<llm_json>\{.*\})" \
    | spath input=llm_json path=confidence output=llm_confidence \
    | spath input=llm_json path=reasons{} output=llm_reasons \
    | spath input=llm_json path=evidence_refs{} output=llm_evidence_refs \
    | eval llm_confidence=tonumber(llm_confidence)

###############################################################################
# Tuning
###############################################################################

[cg_summary_index]
definition = changeguard_detect

# A gap longer than this between a device+user's events starts a new session (seconds).
[cg_session_gap]
definition = 1800

# How long an approved change is watched for impact (seconds; 72h).
[cg_watch_seconds]
definition = 259200

[cg_min_confidence]
definition = 0.6

# Minimum impact score (hops x delay x priority, + spike weight) before asking the LLM.
[cg_impact_threshold]
definition = 0.35

[cg_spike_weight]
definition = 0.3

[cg_spike_ratio]
definition = 5

[cg_spike_min_events]
definition = 50

[cg_max_log_chars]
definition = 6000

###############################################################################
# Helpers (do not edit)
###############################################################################

# Must match changeguard_core.keys.normalise_host: lower-case short hostname, IPv4 kept whole.
[cg_norm_host(1)]
args = f
definition = if(match($f$, "^\d{1,3}(\.\d{1,3}){3}$"), $f$, lower(mvindex(split(trim($f$), "."), 0)))

[cg_nl]
definition = eval nl=urldecode("%0A")

# Mirror the case's current state into the ArangoDB `cases` vertex (the agent reads cases from the graph).
[cg_sync_case]
definition = cgarango collection=cases key=case_id on_error=mark multivalue="services,reasons,deviations,evidence_refs" \
    fields="case_id,device,user,itam_user,platform,first_seen,last_seen,event_count,status,verdict,severity,ci_key,ci_name,services,chg_number,chg_summary,reasons,confidence,deviations,evidence_refs,watch_until,impact_score,impact_incident,evidence_summary,alerted_at,updated_at"

[cg_case_fields]
definition = fields - aql_error arango_status arango_skipped nl cg_prompt llm_raw llm_json llm_confidence llm_reasons llm_evidence_refs
