# ChangeGuard AI pipeline: L1 detect -> L2 sessionise -> L3 graph loaders ->
# L4 correlate -> L5 reason (AI) -> L6 watch -> L7 alert. Each state stage owns one cg_cases status.
# Override schedules/actions in local/savedsearches.conf rather than editing here.

# L1: Palo Alto config changes -> changeguard_detect. Windows are contiguous (-10m@m..-5m@m every 5 min);
# realtime_schedule=0 makes Splunk catch up missed windows instead of skipping them.
[CG - L1 - Detect Palo Alto config change]
search = `cg_src_pan` \
| eval platform="paloalto", device=`cg_norm_host(coalesce(dvc_name, host))`, user=lower(coalesce(admin, user)), \
    src=coalesce(src, src_ip, client_ip), result=coalesce(result, status), \
    detail=trim(coalesce(cmd, "")." ".coalesce(path, "")), \
    before=before_change_detail, after=after_change_detail, \
    detail_kind=if(len(before)>0 OR len(after)>0, "config_diff", "command"), \
    event_id=md5(_time.device.user.detail) \
| table _time event_id platform device user src detail_kind detail before after result \
| collect index=`cg_summary_index` source="cg:detect:paloalto"
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = -5m@m
realtime_schedule = 0

# L1: IOS/IOS-XE config changes. CONFIG_I says who/when; CFGLOG_LOGGEDCMD (if enabled) says what.
[CG - L1 - Detect router or switch config change]
search = `cg_src_ios` \
| rex "Configured from (?<cfg_method>\S+) by (?<cfg_user>\S+?)(?: on \S+)? \((?<cfg_src>[^)]+)\)" \
| rex "User:(?<cmd_user>\S+)\s+logged command:(?<cmd_text>.+)$" \
| eval platform="cisco_ios", device=`cg_norm_host(host)`, user=lower(coalesce(cfg_user, cmd_user)), src=cfg_src, \
    detail=coalesce("cmd: ".cmd_text, "configured via ".cfg_method), \
    detail_kind=if(isnotnull(cmd_text), "command", "notice"), \
    event_id=md5(_raw) \
| table _time event_id platform device user src detail_kind detail \
| collect index=`cg_summary_index` source="cg:detect:cisco_ios"
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = -5m@m
realtime_schedule = 0

# L1: Cisco FTD / FMC audit events carrying a user@domain.
[CG - L1 - Detect Cisco FTD config change]
search = `cg_src_ftd` \
| rex "(?<ftd_user>[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)" \
| eval platform="cisco_ftd", device=`cg_norm_host(host)`, user=lower(ftd_user), \
    detail=substr(_raw, 1, 2000), detail_kind="notice", event_id=md5(_raw) \
| table _time event_id platform device user detail_kind detail \
| collect index=`cg_summary_index` source="cg:detect:cisco_ftd"
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = -5m@m
realtime_schedule = 0

# L2: group events into device+user sessions and open ONE case per finished session.
# - looks back 4h so a session's start is always visible (sessions up to ~3.5h; longer ones get truncated=1)
# - a session is finished once it has been quiet for cg_session_gap; it is picked up within the next hour
# - only case ids not already in the KV store are inserted, so re-runs never reset a verdict
[CG - L2 - Sessionise and open cases]
search = index=`cg_summary_index` \
| fillnull value="unknown" user \
| eval device=`cg_norm_host(device)` \
| lookup cg_device_alias alias AS device OUTPUT device AS alias_device \
| eval device=coalesce(alias_device, device) \
| rex field=detail max_match=5 "(?<chg_ref>\b(?:CRQ|CHG)\d{6,12}\b)" \
| eval line=strftime(_time, "%H:%M:%S")." ".coalesce(detail, "").if(len(before)>0 OR len(after)>0, " [before: ".coalesce(before, "-")." | after: ".coalesce(after, "-")."]", ""), \
    detail_flag=if(detail_kind="config_diff" OR detail_kind="command", 1, 0) \
| sort 0 device user _time \
| streamstats current=f last(_time) AS prev_time BY device user \
| eval new_session=if(isnull(prev_time) OR _time-prev_time>`cg_session_gap`, 1, 0) \
| streamstats sum(new_session) AS session_seq BY device user \
| stats min(_time) AS first_seen max(_time) AS last_seen count AS event_count values(platform) AS platform \
    values(src) AS src list(line) AS lines values(chg_ref) AS chg_refs max(detail_flag) AS has_detail \
    BY device user session_seq \
| where last_seen<=now()-`cg_session_gap` AND last_seen>now()-`cg_session_gap`-3600 \
| eval truncated=if(first_seen<relative_time(now(), "-4h@m")+`cg_session_gap`, 1, 0), \
    platform=mvindex(platform, 0), case_id=substr(md5(device."|".user."|".first_seen), 1, 16) \
| `cg_nl` \
| eval change_log=substr(mvjoin(lines, nl), 1, `cg_max_log_chars`) \
| lookup cg_cases_lookup _key AS case_id OUTPUT status AS existing_status \
| where isnull(existing_status) \
| lookup cg_identity device_user AS user OUTPUT itam_user \
| eval itam_user=lower(coalesce(itam_user, replace(user, "@.*$", ""))), \
    status="new", verdict="NEW", severity="info", ai_attempts=0, created_at=now(), updated_at=now(), _key=case_id \
| table _key case_id device user itam_user platform src first_seen last_seen event_count change_log has_detail chg_refs truncated status verdict severity ai_attempts created_at updated_at \
| outputlookup cg_cases_lookup append=true key_field=_key \
| `cg_sync_case` \
| eval from="cases/".case_id, to="devices/".device, device_name=device \
| cgarango collection=case_on from=from to=to fields="case_id" on_error=mark \
| cgarango collection=devices key=device fields="device_name,platform" on_error=mark
enableSched = 1
cron_schedule = */5 * * * *
max_concurrent = 1
dispatch.earliest_time = -4h@m
dispatch.latest_time = now

# L3: HELIX CIs -> Arango cis/services; also records which collection each CI went to.
# Incremental (last 20 min every 15 min). For the first/full load run it once over All time.
[CG - L3 - Load CIs and services]
search = `cg_helix_ci` \
| `cg_map_ci` \
| where isnotnull(ci_id) AND deleted!=1 \
| stats latest(name) AS name latest(ci_class) AS ci_class latest(environment) AS environment \
    latest(ci_status) AS ci_status latest(mgmt_ip) AS mgmt_ip BY ci_id \
| eval collection=if(`cg_is_service_ci`, "services", "cis"), updated_at=now() \
| cgarango collection_field=collection key=ci_id fields="ci_id,name,ci_class,environment,ci_status,mgmt_ip,updated_at" \
| eval _key=ci_id \
| table _key ci_id collection arango_status \
| outputlookup cg_ci_index append=true key_field=_key \
| stats count BY collection arango_status
enableSched = 1
cron_schedule = */15 * * * *
max_concurrent = 1
dispatch.earliest_time = -20m@m
dispatch.latest_time = now

# L3: network CIs -> devices + device_is. Hostname normalisation happens ONCE here (cg_norm_host);
# cg_device_ci_override.csv fixes names that do not match.
# Incremental (last 20 min every 15 min). For the first/full load run it once over All time.
[CG - L3 - Load devices]
search = `cg_helix_ci` \
| `cg_map_ci` \
| where isnotnull(ci_id) AND deleted!=1 AND `cg_is_network_ci` \
| stats latest(name) AS name latest(mgmt_ip) AS mgmt_ip BY ci_id \
| eval device=`cg_norm_host(name)`, match_source="name" \
| append [| inputlookup cg_device_ci_override | eval device=`cg_norm_host(device)`, match_source="override"] \
| where isnotnull(device) AND isnotnull(ci_id) \
| eval device_name=device, from="devices/".device, to="cis/".ci_id \
| cgarango collection=devices key=device fields="device_name,mgmt_ip" \
| cgarango collection=device_is from=from to=to fields="match_source" \
| stats count BY match_source arango_status
enableSched = 1
cron_schedule = */15 * * * *
max_concurrent = 1
dispatch.earliest_time = -20m@m
dispatch.latest_time = now

# L3: HELIX parent/child relationships -> ci_rel (provider -> consumer, see cg_map_ci_rel).
# Incremental (last 20 min every 15 min). For the first/full load run it once over All time.
[CG - L3 - Load CI relationships]
search = `cg_helix_ci_rel` \
| `cg_map_ci_rel` \
| where isnotnull(provider_id) AND isnotnull(consumer_id) AND deleted!=1 \
| stats latest(rel_type) AS rel_type BY provider_id consumer_id \
| lookup cg_ci_index _key AS provider_id OUTPUT collection AS provider_col \
| lookup cg_ci_index _key AS consumer_id OUTPUT collection AS consumer_col \
| eval from=coalesce(provider_col, "cis")."/".provider_id, to=coalesce(consumer_col, "cis")."/".consumer_id \
| cgarango collection=ci_rel from=from to=to fields="rel_type" \
| stats count BY arango_status
enableSched = 1
cron_schedule = */15 * * * *
max_concurrent = 1
dispatch.earliest_time = -20m@m
dispatch.latest_time = now

# L3: Change_Information -> changes, people, implemented_by.
# Incremental (last 20 min every 15 min). For the first/full load run it once over All time.
[CG - L3 - Load changes]
search = `cg_helix_change_info` \
| `cg_map_change_info` \
| where isnotnull(chg_number) \
| stats latest(summary) AS summary latest(description) AS description latest(plan) AS plan latest(status) AS status \
    latest(chg_class) AS chg_class latest(risk) AS risk latest(implementer) AS implementer \
    latest(planned_start) AS planned_start latest(planned_end) AS planned_end latest(actual_start) AS actual_start \
    latest(actual_end) AS actual_end latest(created_at) AS created_at BY chg_number \
| eval updated_at=now() \
| cgarango collection=changes key=chg_number fields="summary,description,plan,status,chg_class,risk,implementer,planned_start,planned_end,actual_start,actual_end,created_at,updated_at" \
| where isnotnull(implementer) \
| eval person=implementer, from="changes/".chg_number, to="people/".implementer \
| cgarango collection=people key=person fields="person" \
| cgarango collection=implemented_by from=from to=to fields="chg_number" \
| stats count BY arango_status
enableSched = 1
cron_schedule = */15 * * * *
max_concurrent = 1
dispatch.earliest_time = -20m@m
dispatch.latest_time = now

# L3: Change_Approvals -> changes.approval (latest decision wins).
# Incremental (last 20 min every 15 min). For the first/full load run it once over All time.
[CG - L3 - Load change approvals]
search = `cg_helix_change_approvals` \
| `cg_map_change_approvals` \
| where isnotnull(chg_number) \
| sort 0 chg_number approval_time \
| stats last(approval) AS approval last(approver) AS approver max(approval_time) AS approval_time BY chg_number \
| cgarango collection=changes key=chg_number fields="approval,approver,approval_time" \
| stats count BY approval arango_status
enableSched = 1
cron_schedule = */15 * * * *
max_concurrent = 1
dispatch.earliest_time = -20m@m
dispatch.latest_time = now

# L3: Change_CI_Assoc -> chg_affects.
# Incremental (last 20 min every 15 min). For the first/full load run it once over All time.
[CG - L3 - Load change CI associations]
search = `cg_helix_change_ci` \
| `cg_map_change_ci` \
| where isnotnull(chg_number) AND isnotnull(ci_id) \
| stats count BY chg_number ci_id \
| lookup cg_ci_index _key AS ci_id OUTPUT collection AS ci_col \
| eval from="changes/".chg_number, to=coalesce(ci_col, "cis")."/".ci_id \
| cgarango collection=chg_affects from=from to=to fields="chg_number,ci_id" \
| stats count BY arango_status
enableSched = 1
cron_schedule = */15 * * * *
max_concurrent = 1
dispatch.earliest_time = -20m@m
dispatch.latest_time = now

# L3: Incident_Data -> incidents + inc_on (to the CI and/or the service).
# Incremental (last 20 min every 15 min). For the first/full load run it once over All time.
[CG - L3 - Load incidents]
search = `cg_helix_incidents` \
| `cg_map_incidents` \
| where isnotnull(inc_number) \
| stats latest(summary) AS summary latest(priority) AS priority latest(inc_status) AS status \
    latest(opened_at) AS opened_at latest(ci_id) AS ci_id latest(service_id) AS service_id BY inc_number \
| cgarango collection=incidents key=inc_number fields="summary,priority,status,opened_at,ci_id,service_id" \
| eval target=mvappend(ci_id, service_id) \
| mvexpand target \
| lookup cg_ci_index _key AS target OUTPUT collection AS target_col \
| eval from="incidents/".inc_number, to=coalesce(target_col, "cis")."/".target \
| cgarango collection=inc_on from=from to=to fields="inc_number" \
| stats count BY arango_status
enableSched = 1
cron_schedule = */15 * * * *
max_concurrent = 1
dispatch.earliest_time = -20m@m
dispatch.latest_time = now

# L3: cg_identity.csv -> people.device_users; cg_ha_pairs.csv -> ha_peer. Hourly.
[CG - L3 - Load identities and HA pairs]
search = | inputlookup cg_identity \
| where isnotnull(itam_user) \
| eval itam_user=lower(itam_user), device_user=lower(device_user) \
| stats values(device_user) AS device_users BY itam_user \
| cgarango collection=people key=itam_user fields="device_users" \
| append [| inputlookup cg_ha_pairs \
    | eval a=`cg_norm_host(device_a)`, b=`cg_norm_host(device_b)`, from="devices/".a, to="devices/".b \
    | cgarango collection=ha_peer from=from to=to fields="a,b"] \
| stats count BY arango_status
enableSched = 1
cron_schedule = 7 * * * *
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# L4: one AQL query per new case (best CHG + alternative authorisations) and a rule-based verdict.
# Owns status=new. Routes to: review | investigate | intent_check | watch | alert.
# If ArangoDB is unreachable the case stays new and is retried next run.
[CG - L4 - Correlate new cases]
search = | inputlookup cg_cases_lookup where status="new" \
| cgaql query=best_change prefix=m_ \
| cgaql query=alt_explanations prefix=alt_ \
| where isnull(aql_error) \
| eval ci_key=m_ci_key, ci_name=m_ci_name, services=m_services, chg_number=m_chg_number, chg_summary=m_chg_summary, \
    chg_approval=m_chg_approval, chg_implementer=m_chg_implementer, planned_start=m_planned_start, \
    planned_end=m_planned_end, in_window=m_in_window, approved=m_approved, user_ok=m_user_ok, match_score=m_match_score \
| eval verdict=case( \
    m_ci_count=0, "UNKNOWN_CI", \
    isnull(chg_number) AND alt_total=0, "UNPLANNED_CHANGE", \
    isnull(chg_number), "UNPLANNED_CANDIDATE", \
    approved="false", "UNAPPROVED", \
    in_window="false", "OUT_OF_WINDOW", \
    user_ok="false", "WRONG_IMPLEMENTER", \
    has_detail=1, "PENDING_INTENT_CHECK", \
    true(), "COMPLIANT_WATCH") \
| eval reasons=case( \
    verdict="UNKNOWN_CI", "Device ".device." is not mapped to a HELIX CI (check device_is / cg_device_ci_override)", \
    verdict="UNPLANNED_CHANGE", "No CHG on CI ".coalesce(ci_name, "?")." within 7 days, none on its HA peer or related CIs, none for engineer ".coalesce(itam_user, "?")." in the window, none referenced or raised afterwards", \
    verdict="UNPLANNED_CANDIDATE", "No CHG on CI ".coalesce(ci_name, "?")."; ".alt_total." other possible authorisation(s) to assess", \
    verdict="UNAPPROVED", chg_number." is not approved (approval ".coalesce(chg_approval, "none").", status ".coalesce(m_chg_status, "?").")", \
    verdict="OUT_OF_WINDOW", "Change ran ".strftime(first_seen, "%F %T")."-".strftime(last_seen, "%T")." outside the ".chg_number." window ".strftime(planned_start, "%F %T")."-".strftime(planned_end, "%F %T"), \
    verdict="WRONG_IMPLEMENTER", "Performed by ".user." (".coalesce(itam_user, "?").") but ".chg_number." is assigned to ".coalesce(chg_implementer, "nobody"), \
    verdict="PENDING_INTENT_CHECK", chg_number." approved, in window, implementer matches", \
    true(), chg_number." approved, in window, implementer matches; config detail not logged, so intent cannot be verified") \
| eval status=case(verdict="UNKNOWN_CI", "review", verdict="UNPLANNED_CANDIDATE", "investigate", \
        verdict="PENDING_INTENT_CHECK", "intent_check", verdict="COMPLIANT_WATCH", "watch", true(), "alert"), \
    severity=case(verdict="UNPLANNED_CHANGE" OR verdict="UNAPPROVED", "high", status="alert", "medium", true(), "info"), \
    confidence=if(status="alert" OR status="watch", 1, null()), \
    watch_until=if(status="watch", last_seen+`cg_watch_seconds`, null()), updated_at=now() \
| fields - m_* alt_peer_count alt_neighbour_count alt_person_count alt_late_count alt_ref_count alt_ha_peers alt_count \
| `cg_case_fields` \
| outputlookup cg_cases_lookup append=true key_field=_key \
| `cg_sync_case` \
| where isnotnull(chg_number) \
| eval from="cases/".case_id, to="changes/".chg_number, reason="best matching CHG (score ".match_score."/7)" \
| cgarango collection=case_matched from=from to=to fields="reason" on_error=mark
enableSched = 1
cron_schedule = */5 * * * *
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# L5a (scenario 03): does the actual config implement the approved CHG? Owns status=intent_check.
# -> watch (match) | alert IMPLEMENTATION_DEVIATION | review (low confidence / 3 failed LLM calls)
[CG - L5a - Intent check (AI)]
search = | inputlookup cg_cases_lookup where status="intent_check" \
| cgaql query=change_detail prefix=c_ \
| where isnull(aql_error) \
| `cg_nl` \
| eval cg_prompt="You are ChangeGuard, a network change-assurance analyst. Decide whether the ACTUAL configuration changes implement the APPROVED change and nothing more.".nl. \
    "Flag: rules or objects the change does not mention; sources, destinations, applications or services broader than approved (for example 'any'); allow vs deny mismatches; missing steps.".nl. \
    "Reply with ONLY one JSON object, no markdown: {\"match\":\"yes|partial|no\",\"confidence\":0.0-1.0,\"deviations\":[\"...\"],\"reasons\":[\"...\"],\"evidence_refs\":[\"log timestamp or CHG field relied on\"]}".nl.nl. \
    "APPROVED CHANGE ".chg_number.nl."Summary: ".coalesce(c_summary, "").nl."Description: ".coalesce(c_description, "").nl."Implementation plan: ".coalesce(c_plan, "").nl.nl. \
    "DEVICE ".device." (CI ".coalesce(ci_name, "?").", platform ".platform.") changed by ".user." between ".strftime(first_seen, "%F %T")." and ".strftime(last_seen, "%F %T").nl. \
    "ACTUAL CHANGES (".event_count." events):".nl.change_log \
| `cg_llm(cg_prompt, intent)` \
| `cg_parse_llm` \
| spath input=llm_json path=match output=intent_match \
| spath input=llm_json path=deviations{} output=llm_deviations \
| eval intent_match=lower(trim(intent_match)), ai_attempts=coalesce(ai_attempts, 0)+1 \
| eval verdict=case( \
    isnull(intent_match) AND ai_attempts<3, verdict, \
    isnull(intent_match) OR llm_confidence<`cg_min_confidence`, "NEEDS_REVIEW", \
    intent_match="yes", "COMPLIANT_WATCH", \
    intent_match="partial" OR intent_match="no", "IMPLEMENTATION_DEVIATION", \
    true(), "NEEDS_REVIEW") \
| eval status=case(verdict="PENDING_INTENT_CHECK", "intent_check", verdict="COMPLIANT_WATCH", "watch", \
        verdict="IMPLEMENTATION_DEVIATION", "alert", true(), "review"), \
    severity=if(verdict="IMPLEMENTATION_DEVIATION", "high", severity), \
    watch_until=if(status="watch", last_seen+`cg_watch_seconds`, null()), \
    confidence=coalesce(llm_confidence, confidence), deviations=llm_deviations, \
    reasons=if(isnotnull(llm_reasons), mvappend(reasons, llm_reasons), reasons), evidence_refs=llm_evidence_refs, \
    ai_raw=substr(llm_raw, 1, 4000), ai_attempts=if(status="intent_check", ai_attempts, 0), updated_at=now() \
| fields - c_* intent_match llm_deviations \
| `cg_case_fields` \
| outputlookup cg_cases_lookup append=true key_field=_key \
| `cg_sync_case`
enableSched = 1
cron_schedule = */5 * * * *
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# L5b (scenario 02): no CHG on the CI, but the graph found other possible authorisations. Owns status=investigate.
# The LLM may only pick an authorising change from the candidates the graph returned.
# -> watch AUTHORISED_OTHER_CHG | alert UNPLANNED_CHANGE | review
[CG - L5b - Investigate unplanned (AI)]
search = | inputlookup cg_cases_lookup where status="investigate" \
| `cg_nl` \
| eval cg_prompt="You are ChangeGuard, a network change-assurance analyst. A configuration change was made with no change record on the device's own CI. Decide whether one of the CANDIDATE changes credibly authorised it.".nl. \
    "A candidate is credible only if its description plausibly covers what was changed on this device, the timing fits and the engineer fits. Being nearby is not enough.".nl. \
    "Reply with ONLY one JSON object, no markdown: {\"verdict\":\"authorised_elsewhere|unplanned\",\"authorising_change\":\"<chg_number from the candidates or null>\",\"confidence\":0.0-1.0,\"reasons\":[\"...\"],\"evidence_refs\":[\"...\"]}".nl.nl. \
    "CHANGE ON DEVICE ".device." (CI ".coalesce(ci_name, "?").") by ".user." (".coalesce(itam_user, "?").") ".strftime(first_seen, "%F %T")." to ".strftime(last_seen, "%F %T").":".nl.change_log.nl.nl. \
    "CANDIDATES (JSON, field 'why' says how each was found):".nl.alt_evidence \
| `cg_llm(cg_prompt, alt)` \
| `cg_parse_llm` \
| spath input=llm_json path=verdict output=alt_verdict \
| spath input=llm_json path=authorising_change output=alt_chg \
| eval alt_verdict=lower(trim(alt_verdict)), ai_attempts=coalesce(ai_attempts, 0)+1, \
    alt_chg_valid=if(isnotnull(alt_chg) AND isnotnull(mvfind(alt_candidate_keys, "^".alt_chg."$")), 1, 0) \
| eval verdict=case( \
    isnull(alt_verdict) AND ai_attempts<3, verdict, \
    alt_verdict="authorised_elsewhere" AND alt_chg_valid=1 AND llm_confidence>=`cg_min_confidence`, "AUTHORISED_OTHER_CHG", \
    alt_verdict="unplanned" AND llm_confidence>=`cg_min_confidence`, "UNPLANNED_CHANGE", \
    true(), "NEEDS_REVIEW") \
| eval status=case(verdict="UNPLANNED_CANDIDATE", "investigate", verdict="AUTHORISED_OTHER_CHG", "watch", \
        verdict="UNPLANNED_CHANGE", "alert", true(), "review"), \
    severity=if(verdict="UNPLANNED_CHANGE", "high", severity), \
    authorising_change=if(verdict="AUTHORISED_OTHER_CHG", alt_chg, null()), \
    chg_number=coalesce(authorising_change, chg_number), \
    watch_until=if(status="watch", last_seen+`cg_watch_seconds`, null()), \
    confidence=coalesce(llm_confidence, confidence), \
    reasons=if(isnotnull(llm_reasons), mvappend(reasons, llm_reasons), reasons), evidence_refs=llm_evidence_refs, \
    ai_raw=substr(llm_raw, 1, 4000), ai_attempts=if(status="investigate", ai_attempts, 0), updated_at=now() \
| fields - alt_verdict alt_chg alt_chg_valid \
| `cg_case_fields` \
| outputlookup cg_cases_lookup append=true key_field=_key \
| `cg_sync_case` \
| eval candidate=alt_candidate_keys \
| mvexpand candidate \
| where isnotnull(candidate) \
| eval from="cases/".case_id, to="changes/".candidate, \
    reason=if(candidate=authorising_change, "accepted as authorising change", "considered as alternative authorisation") \
| cgarango collection=case_related from=from to=to fields="reason" on_error=mark
enableSched = 1
cron_schedule = */5 * * * *
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# L6 signal: Palo Alto rules whose deny count in the last hour is far above their 24h baseline.
# Heavy on raw traffic logs: switch to tstats if the Network_Traffic data model is accelerated.
[CG - L6s - Deny spikes]
search = `cg_src_pan_traffic` \
| eval device=`cg_norm_host(coalesce(dvc_name, host))`, recent=if(_time>=relative_time(now(), "-1h@h"), 1, 0) \
| stats sum(recent) AS last_hour count AS total BY device rule \
| eval baseline_per_hour=round((total-last_hour)/24, 1), ratio=round((last_hour+1)/(baseline_per_hour+1), 1) \
| where last_hour>=`cg_spike_min_events` AND ratio>=`cg_spike_ratio` \
| table device rule last_hour baseline_per_hour ratio \
| outputlookup cg_deny_spike.csv
enableSched = 1
cron_schedule = 2 * * * *
dispatch.earliest_time = -25h@h
dispatch.latest_time = @h

# L6a (scenario 04): incidents on the CI or downstream since the change, plus deny spikes on rules the change touched.
# Owns status=watch. -> impact_check (score >= threshold) | closed COMPLIANT (watch window over) | watch
[CG - L6a - Watch approved changes]
search = | inputlookup cg_cases_lookup where status="watch" \
| cgaql query=downstream_incidents prefix=w_ params="exclude=dismissed_incidents" \
| where isnull(aql_error) \
| lookup cg_deny_spike device OUTPUT rule AS spike_rule \
| eval spike_rules=mvmap(spike_rule, if(like(change_log, "%".spike_rule."%"), spike_rule, null())) \
| eval impact_score=round(min(1, coalesce(w_top_score, 0)+if(mvcount(spike_rules)>0, `cg_spike_weight`, 0)), 2), \
    impact_incident=w_top_incident, impact_summary=w_top_summary, impact_priority=w_top_priority, \
    impact_hops=w_top_hops, impact_via=w_top_via, impact_delay_min=w_top_delay_min, impact_candidates=w_incident_keys \
| eval status=case(impact_score>=`cg_impact_threshold`, "impact_check", now()>watch_until, "closed", true(), "watch"), \
    verdict=if(status="closed" AND verdict="COMPLIANT_WATCH", "COMPLIANT", verdict), updated_at=now() \
| fields - w_* spike_rule \
| `cg_case_fields` \
| outputlookup cg_cases_lookup append=true key_field=_key \
| `cg_sync_case`
enableSched = 1
cron_schedule = 10 * * * *
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# L6b (scenario 04): is the incident plausibly caused by the change? Owns status=impact_check.
# -> alert POTENTIAL_FAILED_CHANGE | watch (incidents dismissed so they are not asked about again)
[CG - L6b - Impact check (AI)]
search = | inputlookup cg_cases_lookup where status="impact_check" \
| `cg_nl` \
| eval cg_prompt="You are ChangeGuard, a network change-assurance analyst. An approved firewall/network change was followed by an incident. Decide whether the change plausibly caused it.".nl. \
    "Consider: is the affected service reachable through this device (hops), how soon after the change it started, and whether the symptom matches what was changed (blocked ports, removed rules, routing).".nl. \
    "Reply with ONLY one JSON object, no markdown: {\"plausible\":\"yes|no\",\"confidence\":0.0-1.0,\"reasons\":[\"...\"],\"evidence_refs\":[\"...\"]}".nl.nl. \
    "CHANGE ".coalesce(chg_number, "?")." on ".device." by ".user." finished ".strftime(last_seen, "%F %T").":".nl.change_log.nl.nl. \
    "INCIDENT ".impact_incident." (P".impact_priority."): ".coalesce(impact_summary, "").nl. \
    "Opened ".impact_delay_min." min after the change, on ".coalesce(impact_via, "?")." which is ".impact_hops." hop(s) downstream of the device.".nl. \
    "Deny spikes on rules touched by the change: ".coalesce(mvjoin(spike_rules, ", "), "none") \
| `cg_llm(cg_prompt, impact)` \
| `cg_parse_llm` \
| spath input=llm_json path=plausible output=plausible \
| eval plausible=lower(trim(plausible)), ai_attempts=coalesce(ai_attempts, 0)+1, \
    failed=if(plausible="yes" AND llm_confidence>=`cg_min_confidence`, 1, 0) \
| eval verdict=if(failed=1, "POTENTIAL_FAILED_CHANGE", verdict), \
    status=case(failed=1, "alert", isnull(plausible) AND ai_attempts<3, "impact_check", true(), "watch"), \
    severity=if(failed=1, "high", severity), \
    dismissed_incidents=if(status="watch", mvdedup(mvappend(dismissed_incidents, impact_candidates)), dismissed_incidents), \
    confidence=if(failed=1, llm_confidence, confidence), \
    reasons=if(failed=1, mvappend(reasons, "Incident ".impact_incident." ".impact_delay_min." min after the change, ".impact_hops." hop(s) downstream", llm_reasons), reasons), \
    evidence_refs=if(failed=1, llm_evidence_refs, evidence_refs), \
    ai_raw=substr(llm_raw, 1, 4000), ai_attempts=if(status="impact_check", ai_attempts, 0), updated_at=now() \
| fields - plausible \
| `cg_case_fields` \
| outputlookup cg_cases_lookup append=true key_field=_key \
| `cg_sync_case` \
| where failed=1 \
| eval from="cases/".case_id, to="incidents/".impact_incident, reason="incident after change (".impact_hops." hops, ".impact_delay_min." min)", score=impact_score \
| cgarango collection=case_related from=from to=to fields="reason,score" on_error=mark
enableSched = 1
cron_schedule = */15 * * * *
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# L7: build the evidence package (the case subgraph + an AI write-up) and alert once per case.
# Owns status=alert -> alerted. Turn on email/webhook below (or in local/savedsearches.conf).
[CG - L7 - Raise alerts with evidence]
search = | inputlookup cg_cases_lookup where status="alert" \
| cgaql query=case_evidence mode=json out=evidence_json \
| where isnull(aql_error) \
| `cg_nl` \
| eval cg_prompt="You are ChangeGuard. Write a short evidence summary (max 8 lines, plain text) for the network operations team: what changed, why it was flagged, the key evidence, and the recommended next step. Do not invent facts.".nl.nl. \
    "VERDICT: ".verdict." (severity ".severity.", confidence ".coalesce(confidence, "?").")".nl. \
    "DEVICE: ".device." CI ".coalesce(ci_name, "?")." services ".coalesce(mvjoin(services, ", "), "?").nl. \
    "BY: ".user." (".coalesce(itam_user, "?").") ".strftime(first_seen, "%F %T")." to ".strftime(last_seen, "%F %T").nl. \
    "CHG: ".coalesce(chg_number, "none")." ".coalesce(chg_summary, "").nl. \
    "REASONS: ".coalesce(mvjoin(reasons, " | "), "").nl. \
    "DEVIATIONS: ".coalesce(mvjoin(deviations, " | "), "none").nl. \
    "CONFIG CHANGES:".nl.substr(change_log, 1, 3000).nl. \
    "GRAPH EVIDENCE (JSON):".nl.substr(evidence_json, 1, 4000) \
| `cg_llm(cg_prompt, narrative)` \
| eval evidence_summary=coalesce(llm_raw, verdict." on ".device." by ".user.": ".mvjoin(reasons, "; ")), \
    status="alerted", alerted_at=now(), updated_at=now() \
| `cg_case_fields` \
| outputlookup cg_cases_lookup append=true key_field=_key \
| `cg_sync_case` \
| table case_id severity verdict device user itam_user chg_number first_seen last_seen evidence_summary reasons deviations evidence_json
enableSched = 1
cron_schedule = */5 * * * *
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 0
alert.track = 1
alert.severity = 4
action.email = 0
action.email.to = network-ops@example.com
action.email.subject = ChangeGuard $result.severity$: $result.verdict$ on $result.device$
action.email.message.alert = Case $result.case_id$: $result.evidence_summary$ (open the ChangeGuard dashboard for the evidence graph)
action.webhook = 0
action.webhook.param.url = https://example.invalid/changeguard-hook

# Nightly: re-mirror every KV case into the Arango cases vertex (covers writes skipped while Arango was down).
[CG - Resync cases to ArangoDB]
search = | inputlookup cg_cases_lookup \
| `cg_sync_case` \
| stats count BY arango_status
enableSched = 1
cron_schedule = 17 2 * * *
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# Scenario 06 (stretch): train on closed/alerted cases that have a CHG. Needs both outcomes in the data.
[CG - ML - Train change success model]
search = | inputlookup cg_cases_lookup where (status="closed" OR status="alerted") \
| where isnotnull(chg_number) \
| dedup chg_number \
| eval now=first_seen \
| cgaql query=change_features prefix=f_ \
| where isnull(aql_error) AND f_count>0 \
| eval failed=if(verdict="POTENTIAL_FAILED_CHANGE" OR verdict="IMPLEMENTATION_DEVIATION", 1, 0) \
| fit RandomForestClassifier failed from f_chg_class f_risk f_ci_class f_downstream_count f_ci_changes_90d f_ci_incidents_90d f_ci_fail_rate_90d f_implementer_fail_rate f_duration_h f_start_hour f_start_weekday into cg_success_model
enableSched = 1
cron_schedule = 23 3 * * 0
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# Scenario 06: probability of success for upcoming CHGs (next 14 days), with an AI explanation.
[CG - ML - Score proposed changes]
search = | makeresults \
| eval now=now() \
| cgaql query=upcoming_changes mode=all \
| where isnotnull(chg_number) \
| cgaql query=change_features prefix=f_ \
| apply cg_success_model probabilities=true \
| eval success_probability=round(100*'probability(failed=0)', 0) \
| `cg_nl` \
| eval cg_prompt="In two sentences, explain to a change manager why change ".chg_number." (".summary.") has an estimated ".success_probability."% chance of success. Features: downstream dependents ".f_downstream_count.", CI changes in 90 days ".f_ci_changes_90d.", CI incidents in 90 days ".f_ci_incidents_90d.", CI failed-change rate ".f_ci_fail_rate_90d.", engineer failure rate ".f_implementer_fail_rate.", risk ".f_risk.", duration ".f_duration_h."h, start hour ".f_start_hour." UTC." \
| `cg_llm(cg_prompt, explain)` \
| eval explanation=llm_raw \
| table chg_number summary planned_start implementer success_probability explanation f_* \
| outputlookup cg_change_risk.csv
enableSched = 1
cron_schedule = 41 6 * * *
max_concurrent = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now

# Demo: writes the scenario 01-04 events from cg_demo_detections.csv into changeguard_detect, timed relative to now.
# Run right after arango/seed_demo.py, then run the pipeline searches in order (README).
[CG - Demo - Seed detections]
search = | inputlookup cg_demo_detections \
| eval _time=now()-offset_s, event_id=md5(device.detail.offset_s), \
    before=if(len(before)>0, before, null()), after=if(len(after)>0, after, null()), result=if(len(result)>0, result, null()) \
