# KV store: one row per change session (case). Source of truth for case state.
# Each pipeline stage only reads/writes cases in the status it owns, so stages never overwrite each other.
[cg_cases]
field.case_id = string
field.device = string
field.user = string
field.itam_user = string
field.platform = string
field.src = string
field.first_seen = number
field.last_seen = number
field.event_count = number
field.change_log = string
field.has_detail = number
field.chg_refs = string
field.truncated = number
field.status = string
field.verdict = string
field.severity = string
field.created_at = number
field.updated_at = number
field.ci_key = string
field.ci_name = string
field.services = string
field.chg_number = string
field.chg_summary = string
field.chg_approval = string
field.chg_implementer = string
field.planned_start = number
field.planned_end = number
field.in_window = string
field.approved = string
field.user_ok = string
field.match_score = number
field.alt_total = number
field.alt_candidate_keys = string
field.alt_evidence = string
field.reasons = string
field.confidence = number
field.deviations = string
field.evidence_refs = string
field.ai_raw = string
field.ai_attempts = number
field.authorising_change = string
field.watch_until = number
field.impact_score = number
field.impact_incident = string
field.impact_summary = string
field.impact_priority = number
field.impact_hops = number
field.impact_via = string
field.impact_delay_min = number
field.impact_candidates = string
field.spike_rules = string
field.dismissed_incidents = string
field.alerted_at = number
field.evidence_json = string
field.evidence_summary = string
accelerated_fields.status = {"status": 1}
accelerated_fields.device = {"device": 1, "first_seen": -1}

# ci_id -> which Arango collection the CI lives in (cis or services), written by the CI loader.
[cg_ci_index]
field.ci_id = string
field.collection = string
