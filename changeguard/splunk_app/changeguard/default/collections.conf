# Case state (one row per change session). Source of truth for verdicts.
# Every stage only reads and writes cases in the status it owns, and the correlation search only
# inserts case ids that do not exist yet, so nothing can overwrite a verdict set by the AI or the watcher.
[cg_cases]
field.case_id = string
field.session_device = string
field.platform = string
field.device_role = string
field.targets = string
field.doi = string
field.ci_names = string
field.user = string
field.user_display = string
field.user_title = string
field.itam_user = string
field.is_automation = number
field.src = string
field.first_seen = number
field.last_seen = number
field.event_count = number
field.cmds = string
field.change_log = string
field.has_detail = number
field.chg_refs = string
field.comments = string
field.truncated = number
field.status = string
field.verdict = string
field.severity = string
field.created_at = number
field.updated_at = number
field.chg_number = string
field.chg_key = string
field.chg_source = string
field.chg_device = string
field.match_via = string
field.chg_summary = string
field.chg_status = string
field.chg_approval = string
field.chg_implementer = string
field.chg_imp_group = string
field.planned_start = number
field.planned_end = number
field.is_ref = number
field.in_window = number
field.approved = number
field.user_ok = number
field.match_score = number
field.related_changes = string
field.candidate_count = number
field.alt_total = number
field.alt_candidate_keys = string
field.alt_evidence = string
field.reasons = string
field.confidence = number
field.deviations = string
field.evidence_refs = string
field.ai_raw = string
field.ai_attempts = number
field.authorising_change = string
field.watch_until = number
field.followup_case = string
field.followup_minutes = number
field.rollback_case = string
field.impact_score = number
field.impact_incident = string
field.impact_summary = string
field.impact_priority = number
field.impact_hops = number
field.impact_via = string
field.impact_delay_min = number
field.impact_candidates = string
field.dismissed_incidents = string
field.alerted_at = number
field.evidence_json = string
field.evidence_summary = string
accelerated_fields.status = {"status": 1}
accelerated_fields.session_device = {"session_device": 1, "first_seen": -1}

# Approved/planned changes from CALM and HELIX, one row per change + device. _key = change_id|device.
# Kept for 120 days after the change ends (CG - Changes - Cleanup).
[cg_changes]
field.change_id = string
field.source = string
field.device = string
field.ci_name = string
field.status = string
field.approval = string
field.approved = number
field.risk = string
field.chg_type = string
field.start = number
field.end = number
field.actual_start = number
field.actual_end = number
field.created_at = number
field.implementer = string
field.imp_group = string
field.summary = string
field.description = string
field.plan = string
field.updated_at = number
accelerated_fields.device = {"device": 1}
accelerated_fields.change_id = {"change_id": 1}
accelerated_fields.implementer = {"implementer": 1}
